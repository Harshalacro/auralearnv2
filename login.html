<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AuraLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #818cf8;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="glass-card w-full max-w-md p-8 rounded-3xl mx-4 animate-fade-in">
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 mb-2">
                Welcome Back</h1>
            <p class="text-gray-400">Sign in to continue your learning journey</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <input type="email" required class="input-field w-full px-4 py-3 rounded-xl"
                    placeholder="you@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="••••••••">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-gray-400 cursor-pointer">
                    <input type="checkbox"
                        class="mr-2 rounded bg-gray-800 border-gray-700 text-indigo-500 focus:ring-indigo-500">
                    Remember me
                </label>
                <a href="#" class="text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3.5 rounded-xl hover:shadow-lg hover:shadow-indigo-500/30 transition-all transform hover:-translate-y-0.5">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-400">
            Don't have an account?
            <a href="signup.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition-colors">Sign
                up</a>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-gray-500 hover:text-gray-300 text-xs transition-colors">← Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Mock login - just redirect to dashboard
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Signing in...';
            btn.disabled = true;

            setTimeout(() => {
                localStorage.setItem('auraUser', JSON.stringify({ name: 'Student', email: 'student@auralearn.com' }));
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>

</html>
