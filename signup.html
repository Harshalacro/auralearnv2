<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AuraLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s;
        }

        .input-field:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #38bdf8;
            outline: none;
        }
    </style>
</head>

<body>
    <div class="glass-card w-full max-w-md p-8 rounded-3xl mx-4 animate-fade-in">
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-emerald-400 mb-2">
                Create Account</h1>
            <p class="text-gray-400">Join thousands of students learning with AI</p>
        </div>

        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Full Name</label>
                <input type="text" id="nameInput" required class="input-field w-full px-4 py-3 rounded-xl"
                    placeholder="John Doe">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                <input type="email" required class="input-field w-full px-4 py-3 rounded-xl"
                    placeholder="you@example.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                <input type="password" required class="input-field w-full px-4 py-3 rounded-xl" placeholder="••••••••">
            </div>

            <div class="flex items-start mt-4">
                <input type="checkbox" required
                    class="mt-1 mr-2 rounded bg-gray-800 border-gray-700 text-sky-500 focus:ring-sky-500">
                <span class="text-sm text-gray-400">I agree to the <a href="#"
                        class="text-sky-400 hover:text-sky-300">Terms of Service</a> and <a href="#"
                        class="text-sky-400 hover:text-sky-300">Privacy Policy</a></span>
            </div>

            <button type="submit"
                class="w-full bg-gradient-to-r from-sky-500 to-emerald-500 text-white font-bold py-3.5 rounded-xl hover:shadow-lg hover:shadow-sky-500/30 transition-all transform hover:-translate-y-0.5 mt-2">
                Create Account
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-gray-400">
            Already have an account?
            <a href="login.html" class="text-sky-400 hover:text-sky-300 font-medium transition-colors">Sign in</a>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-gray-500 hover:text-gray-300 text-xs transition-colors">← Back to Home</a>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('nameInput').value;

            // Mock signup
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Creating account...';
            btn.disabled = true;

            setTimeout(() => {
                localStorage.setItem('auraUser', JSON.stringify({ name: name, email: 'student@auralearn.com' }));
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>

</html>
