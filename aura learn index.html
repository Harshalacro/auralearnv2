<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura_Learn — Landing</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Cascadia Code -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/cascadia-code" />

  <style>
    body {
      margin: 0;
      font-family: "Cascadia Code";
      background: linear-gradient(160deg, #ffd4f0, #e9d6f5, #8b6ee6, #17072b);
      background-attachment: fixed;
      color: white;
    }

    .glass-btn {
      padding: 0.9rem 1.6rem;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      transition: 0.2s ease;
      display: inline-block;
    }

    #chat-float-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      cursor: pointer;
      font-size: 28px;
      z-index: 100;
    }

    #chat-popup {
      position: fixed;
      bottom: 110px;
      right: 28px;
      width: 330px;
      height: 440px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.20);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      display: none;
      flex-direction: column;
      z-index: 200;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      max-height: 330px;
    }

    #chat-input {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.15);
      color: white;
      outline: none;
    }
  </style>
</head>

<body>

  <!--------- MAIN HERO --------->
  <main style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;">
    <div>
      <h1 style="font-size:clamp(40px,6vw,70px); font-weight:800;">Aura_Learn</h1>
      <div style="height:2px; width:72px; background:white; margin:1rem auto;"></div>
      <p style="max-width:500px; margin:auto; opacity:0.9;">
        Immersive AR learning — explore science and geography models in your space.
      </p>

      <div style="margin-top:2rem;">
        <a href="subjects.html" class="glass-btn">Explore Subjects</a>
      </div>
    </div>
  </main>

  <!--------- FLOATING BUTTON --------->
  <div id="chat-float-btn" onclick="toggleChat()">💬</div>

  <!--------- CHAT POPUP --------->
  <div id="chat-popup">
    <div style="padding:12px; border-bottom:1px solid rgba(255,255,255,0.15); font-weight:700; font-size:18px;">
      Aura Chat
    </div>

    <div id="chat-box"></div>

    <div style="padding:12px; display:flex; gap:10px;">
      <input id="chat-input" placeholder="Type here..." />
      <button onclick="sendMessage()" style="padding:8px 14px; background:rgba(255,255,255,0.25); border-radius:10px;">
        Send
      </button>
    </div>
  </div>

  <script src="chatbot.js"></script>
</body>
</html>
